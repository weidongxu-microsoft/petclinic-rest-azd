name: Validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/petclinic-main.json
          az bicep build --file infra/application.bicep --outfile /tmp/petclinic-application.json
      - name: Build container
        run: docker build --tag petclinic-rest:test .
      - name: Validate database and packaged application
        shell: pwsh
        run: |
          ./tests/Test-DatabaseInitialization.ps1 -DatabaseEngine postgresql -ApplicationImage petclinic-rest:test
          ./tests/Test-DatabaseInitialization.ps1 -DatabaseEngine mysql -ApplicationImage petclinic-rest:test
