name: Validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/petclinic-main.json
          az bicep build --file infra/application.bicep --outfile /tmp/petclinic-application.json
      - name: Validate database hooks
        shell: pwsh
        run: |
          ./tests/Test-DatabaseFirewall.ps1
          ./tests/Test-DatabaseIdentity.ps1
      - name: Build container
        run: docker build --tag petclinic-rest:test .
      - name: Validate database and packaged application
        shell: pwsh
        run: |
          ./tests/Test-ApplicationDatabase.ps1 -ApplicationImage petclinic-rest:test
