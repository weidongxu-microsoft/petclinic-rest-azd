<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Spring Petclinic REST on Azure</title>
  <desc id="description">HTTPS clients reach Spring Petclinic REST in Azure Container Apps. A user-assigned managed identity pulls the image and connects to PostgreSQL over verified TLS as the non-admin petclinic_app role. An administrator maps this identity and grants schema permissions during provisioning. Petclinic creates and seeds its own tables. Logs go to Log Analytics. No database password or Key Vault is used.</desc>
  <rect width="1280" height="800" fill="#f7f9fc"/>
  <text x="40" y="52" font-family="Arial" font-size="30" font-weight="bold" fill="#183153">Spring Petclinic REST on Azure</text>
  <text x="40" y="84" font-family="Arial" font-size="17" fill="#42556e">azd + Bicep | Original application source and startup SQL | Passwordless PostgreSQL</text>
  <rect x="210" y="120" width="1030" height="590" rx="18" fill="#ffffff" stroke="#9eb5cf" stroke-width="2"/>
  <text x="235" y="150" font-family="Arial" font-size="18" font-weight="bold" fill="#183153">Azure resource group</text>
  <rect x="235" y="170" width="600" height="310" rx="12" fill="#eef6ff" stroke="#8ab6e2" stroke-width="2"/>
  <text x="260" y="202" font-family="Arial" font-size="18" font-weight="bold" fill="#183153">Azure Container Apps environment</text>
  <polyline points="170,280 260,280" fill="none" stroke="#2673b8" stroke-width="3"/>
  <polygon points="260,280 249,274 249,286" fill="#2673b8"/>
  <text x="184" y="264" font-family="Arial" font-size="14" fill="#42556e">HTTPS</text>
  <polyline points="500,255 520,255 520,220 905,220 905,255 930,255" fill="none" stroke="#2673b8" stroke-width="3"/>
  <polygon points="930,255 919,249 919,261" fill="#2673b8"/>
  <text x="690" y="208" font-family="Arial" font-size="14" fill="#42556e">TLS + managed identity</text>
  <polyline points="380,565 380,350" fill="none" stroke="#2673b8" stroke-width="3"/>
  <polygon points="380,350 374,361 386,361" fill="#2673b8"/>
  <text x="390" y="538" font-family="Arial" font-size="14" fill="#42556e">Managed identity image pull</text>
  <polyline points="650,480 650,565" fill="none" stroke="#2673b8" stroke-width="3"/>
  <polygon points="650,565 644,554 656,554" fill="#2673b8"/>
  <text x="665" y="548" font-family="Arial" font-size="14" fill="#42556e">Application logs</text>
  <rect x="20" y="240" width="150" height="80" rx="12" fill="#ffffff" stroke="#9eb5cf" stroke-width="2"/>
  <text x="95" y="274" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#183153">API clients</text>
  <text x="95" y="298" text-anchor="middle" font-family="Arial" font-size="14" fill="#42556e">Public / no auth</text>
  <rect x="260" y="235" width="240" height="115" rx="12" fill="#ffffff" stroke="#2673b8" stroke-width="2"/>
  <text x="380" y="269" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#183153">Petclinic REST</text>
  <text x="380" y="296" text-anchor="middle" font-family="Arial" font-size="16" fill="#42556e">Spring Boot / Java 17</text>
  <text x="380" y="326" text-anchor="middle" font-family="Arial" font-size="14" fill="#42556e">Identity: application</text>
  <text x="560" y="277" font-family="Arial" font-size="18" font-weight="bold" fill="#183153">Application-owned startup</text>
  <text x="560" y="307" font-family="Arial" font-size="16" fill="#42556e">Original schema + seed SQL</text>
  <text x="560" y="337" font-family="Arial" font-size="14" fill="#42556e">App owns its tables; no admin role</text>
  <rect x="930" y="225" width="280" height="125" rx="12" fill="#eaf7ed" stroke="#568960" stroke-width="2"/>
  <text x="1070" y="260" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#183153">PostgreSQL 16</text>
  <text x="1070" y="288" text-anchor="middle" font-family="Arial" font-size="16" fill="#42556e">Azure Flexible Server</text>
  <text x="1070" y="314" text-anchor="middle" font-family="Arial" font-size="14" fill="#42556e">petclinic_app: non-admin identity</text>
  <text x="1070" y="337" text-anchor="middle" font-family="Arial" font-size="14" fill="#42556e">B1ms / B2s + 32 GiB storage</text>
  <text x="930" y="410" font-family="Arial" font-size="17" font-weight="bold" fill="#183153">Entra-only authentication</text>
  <text x="930" y="438" font-family="Arial" font-size="15" fill="#42556e">No database password</text>
  <text x="930" y="466" font-family="Arial" font-size="15" fill="#42556e">No Key Vault</text>
  <rect x="260" y="565" width="240" height="100" rx="12" fill="#ffffff" stroke="#2673b8" stroke-width="2"/>
  <text x="380" y="602" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#183153">Container Registry</text>
  <text x="380" y="632" text-anchor="middle" font-family="Arial" font-size="15" fill="#42556e">Private application image</text>
  <rect x="550" y="565" width="240" height="100" rx="12" fill="#ffffff" stroke="#2673b8" stroke-width="2"/>
  <text x="670" y="602" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#183153">Log Analytics</text>
  <text x="670" y="632" text-anchor="middle" font-family="Arial" font-size="15" fill="#42556e">Application logs</text>
  <text x="930" y="594" font-family="Arial" font-size="15" fill="#42556e">Database: outbound-IP allowlist</text>
  <text x="930" y="621" font-family="Arial" font-size="15" fill="#42556e">One application managed identity</text>
  <text x="930" y="648" font-family="Arial" font-size="15" fill="#42556e">No private endpoints / NAT gateway</text>
  <text x="40" y="750" font-family="Arial" font-size="17" font-weight="bold" fill="#183153">Demo baseline, not a production reference architecture.</text>
  <text x="40" y="778" font-family="Arial" font-size="16" fill="#42556e">The API is public and unauthenticated. Do not use sensitive data. Shared egress IPs are not workload isolation.</text>
</svg>
